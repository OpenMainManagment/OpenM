services:
  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    restart: unless-stopped
    environment:
      # Optional: fixed JWT signing key (min. 32 chars). If unset, one is
      # generated once and stored in the database volume.
      OPENM_SECRET_KEY: ${OPENM_SECRET_KEY:-}
    volumes:
      - ./data/database:/app/database
      - ./data/storage:/data/storage

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${OPENM_PORT:-80}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
